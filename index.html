<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام ERP - إدارة الأجور والعمالة</title>
  
  <!-- Tailwind CSS عبر CDN للعمل المباشر على GitHub دون بيئة بناء معقدة -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* تحسين شكل شريط التمرير للنظام */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex h-screen overflow-hidden">

  <!-- 1. حاوية القائمة الجانبية المستقلة -->
  <aside id="sidebar-root" class="h-full flex-shrink-0"></aside>

  <!-- 2. حاوية المحتوى الرئيسي المتغير حسب الشاشة النشطة -->
  <main id="content-root" class="flex-1 h-full overflow-y-auto bg-slate-50 relative"></main>

  <!-- 3. الربط البرمجي لنقطة الانطلاق -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
